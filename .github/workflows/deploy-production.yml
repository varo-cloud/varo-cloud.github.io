name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: https://api.varo.cloud/api
          VITE_BASE: /
          VITE_SITE_ORIGIN: https://varo.cloud
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_INFERENCE_API_BASE_URL: https://inference.varo.cloud/v1
          VITE_DOCS_URL: https://docs.varo.cloud
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve status
        id: status
        run: |
          BUILD="${{ needs.build.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          if [[ "$BUILD" == "success" && "$DEPLOY" == "success" ]]; then
            echo "value=success" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD" == "cancelled" || "$DEPLOY" == "cancelled" ]]; then
            echo "value=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "value=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Lark
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: ${{ secrets.LARK_WEBHOOK_URL }}
          environment: Production
          status: ${{ steps.status.outputs.value }}
          site_url: https://varo.cloud
